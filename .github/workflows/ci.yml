name: Al-Madina ERP CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Type Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          elif [ -f bun.lock ]; then
            npm install
          else
            npm install
          fi

      - name: Verify TypeScript & Code Validity
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE: /Al-Madina-Electronics-Appliances/
