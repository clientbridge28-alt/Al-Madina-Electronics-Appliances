name: Deploy Al-Madina ERP to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify GitHub Pages Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript Types
        run: npm run lint

      - name: Verify Firestore Security Rules
        run: npm run lint:rules

      - name: Run ERP Unit & Accounting Tests
        run: npm test

      - name: Validate Production Firebase Configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: node .github/scripts/validate-firebase-env.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_ACTIONS: 'true'
          VITE_BASE: /Al-Madina-Electronics-Appliances/
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID || vars.VITE_FIREBASE_DATABASE_ID }}

      - name: Verify Production Bundle & SPA Fallback
        run: |
          test -f dist/index.html
          test -f dist/404.html
          grep -q '/Al-Madina-Electronics-Appliances/assets/' dist/index.html
          if grep -rq "gen-lang-client-0548186480" dist/; then
            echo "ERROR: Old sandbox Firebase config (gen-lang-client-0548186480) detected in production bundle!"
            exit 1
          fi
          grep -rq "al-madina-electronics.firebaseapp.com" dist/assets/
          grep -rq "al-madina-electronics" dist/assets/
          echo "Production bundle verified cleanly for al-madina-electronics under /Al-Madina-Electronics-Appliances/."

      - name: Upload GitHub Pages Artifact
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: './dist'
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
