name: Deploy Al-Madina ERP to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Clean Lockfile)
        run: npm ci

      - name: Verify TypeScript Types
        run: npm run lint

      - name: Verify Firestore Security Rules
        run: npm run lint:rules

      - name: Run ERP Unit & Accounting Tests
        run: npm test

      - name: Validate Production Firebase Configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          node -e '
            const allVars = [
              "VITE_FIREBASE_API_KEY",
              "VITE_FIREBASE_AUTH_DOMAIN",
              "VITE_FIREBASE_PROJECT_ID",
              "VITE_FIREBASE_STORAGE_BUCKET",
              "VITE_FIREBASE_MESSAGING_SENDER_ID",
              "VITE_FIREBASE_APP_ID",
              "VITE_FIREBASE_DATABASE_ID",
            ];
            const requiredVars = [
              "VITE_FIREBASE_API_KEY",
              "VITE_FIREBASE_APP_ID",
              "VITE_FIREBASE_MESSAGING_SENDER_ID",
              "VITE_FIREBASE_PROJECT_ID",
            ];
            const errors = [];

            for (const key of allVars) {
              const raw = process.env[key];
              if (raw === undefined || raw === "") {
                if (requiredVars.includes(key)) {
                  errors.push(`${key}: MISSING in GitHub Repository Variables/Secrets`);
                }
                continue;
              }
              if (raw !== raw.trim()) {
                errors.push(`${key}: MALFORMED (contains leading or trailing whitespace)`);
              }
              if (raw.includes("\"") || raw.includes("\x27")) {
                errors.push(`${key}: MALFORMED (contains quotes; remove surrounding quotes)`);
              }
              if (raw.trim().endsWith(",")) {
                errors.push(`${key}: MALFORMED (contains trailing comma; remove trailing comma)`);
              }
              if (/^YOUR_FIREBASE_|remixed-project-id/.test(raw.trim())) {
                errors.push(`${key}: PLACEHOLDER value is not allowed in production`);
              }
            }

            const pid = (process.env.VITE_FIREBASE_PROJECT_ID || "").trim();
            if (pid && pid !== "al-madina-electronics") {
              errors.push(`VITE_FIREBASE_PROJECT_ID: expected "al-madina-electronics", got "${pid}"`);
            }

            const authDomain = (process.env.VITE_FIREBASE_AUTH_DOMAIN || "").trim();
            if (authDomain && authDomain !== "al-madina-electronics.firebaseapp.com") {
              errors.push(`VITE_FIREBASE_AUTH_DOMAIN: expected "al-madina-electronics.firebaseapp.com", got "${authDomain}"`);
            }

            if (errors.length > 0) {
              console.error("Firebase configuration validation failed:\n- " + errors.join("\n- "));
              process.exit(1);
            }
            console.log("All VITE_FIREBASE_* variables validated cleanly (no quotes, no trailing commas, exact project match).");
          '

      - name: Build for GitHub Pages
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_ACTIONS: 'true'
          VITE_BASE: /Al-Madina-Electronics-Appliances/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN || 'al-madina-electronics.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET || 'al-madina-electronics.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || secrets.VITE_FIREBASE_DATABASE_ID }}

      - name: Verify Production Bundle & SPA Fallback
        run: |
          test -f dist/index.html && test -f dist/404.html
          if grep -rq "gen-lang-client-0548186480" dist/; then
            echo "ERROR: Old sandbox Firebase config (gen-lang-client-0548186480) detected in production bundle!"
            exit 1
          fi
          grep -rq "al-madina-electronics.firebaseapp.com" dist/assets/
          grep -rq "al-madina-electronics" dist/assets/
          echo "Production bundle verified cleanly for al-madina-electronics."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
